    <script src="js/vue.global.js"></script>
</head>
<body>
	<div class="wrapper">
		<div class="sample">
			<form v-if="!sent"  @submit.prevent="sent = true">
				<div class="form-group">
					<label>Email</label>
					<input type="text" class="form-control" v-model="email">
				</div>
				<div class="form-group">
					<label>Phone</label>
					<input type="text" class="form-control" v-model="phone">
				</div>
				<div class="form-group">
					<label>FN</label>
					<input type="text" class="form-control" v-model="fn">
				</div>
				<div class="form-group">
					<label>LN</label>
					<input type="text" class="form-control" v-model="ln">
				</div>
				<div class="form-group">
					<label>Guests</label>
					<input type="button" class="btn btn-primary" value="+" @click="addGuest">
				</div>
				<hr>
				<div class="form-group" v-for="(guest, i) in guests">
					Guest {{ i + 1}}
					<input type="text" class="form-control" v-model="guests[i]">
				</div>
				<hr>
				<button class="btn btn-success" v-show="email && phone && fn && ln">Send Data</button>
				<hr>
			</form>
			<div v-else>
				<h2>All done!</h2>
				<table class="table table-bordered">
					<tr>
						<td>Email</td>
						<td>{{ email }}</td>
					</tr>
					<tr>
						<td>Phone</td>
						<td>{{ phone }}</td>
					</tr>
					<tr>
						<td>Full Name</td>
						<td>{{ fn }} {{ ln }}</td>
					</tr>
					<tr v-for="(guest, i) in guests">
						<td>Guest {{ i + 1 }}</td>
						<td>{{ guests[i] }}</td>
					</tr>
				</table>
			</div>
		</div>
	</div>
	<script>
		let app = Vue.createApp({
			data: () => ({
				email: '',
				phone: '',
				fn: '',
				ln: '',
				guests: [],
				sent: false
			}),
			methods: {
				addGuest(){
					this.guests.push(' ');
				},

			}
		}).mount('.sample');
		
	</script>
</body>
</html>
