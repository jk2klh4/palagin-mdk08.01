<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Образовательная онлайн-платформа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="header__nav nav">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a class="nav__link" href="">О нас</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__link" href="">Платформа</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__link" href="">Курсы</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__link" href="">Лекции</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__link" href="">Тарифы</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__link" href="">Блог</a>
                    </li>
                    <li class="nav__item">
                        <a class="nav__link" href="">Контакты</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="main">
        <section class="hero">
            <div class="container">
                <div class="hero__content">
                    <a class="hero__logo" href="">
                        <img class="hero__logo-img" src="img/icon.png" alt="logo">
                        <span class="hero__logo-text">E-Mentor</span>
                    </a>
                    <h1 class="hero__title"><span class="hero__title-line">Образовательная</span> онлайн-платформа</h1>
                    <p class="hero__text">Курсы и видео-лекции по дизайну, программированию, SMM, таргету и многим другим направлениям</p>
                    <a class="button hero__button" href="">Все направления</a>
                </div>
                <ul class="hero__socials">
                    <li class="hero__socials-item">
                        <a class="hero__social-link" href="">
                            <img class="hero__social-icon" src="img/icon3.svg" alt="facebook">
                        </a>
                    </li>
                    <li class="hero__socials-item">
                        <a class="hero__social-link" href="" >
                            <img class="hero__social-icon" src="img/icon4.svg" alt="vk">
                        </a>
                    </li>
                    <li class="hero__socials-item">
                        <a class="hero__social-link" href="">
                            <img class="hero__social-icon" src="img/icon5.svg" alt="instagram">
                        </a>
                    </li>
                </ul>
                <div class="hero__picture hero__picture--left">
                    <img class="hero__img" src="img/3.png" alt="">
                </div>
                <div class="hero__picture hero__picture--right">
                    <img class="hero__img" src="img/4 (1).png" alt="">
                </div>
                <a class="hero__scroll" href="">
                    <p class="hero__scroll-text">Листайте вниз</p>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
