<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body >

<div class="container">
    <h2>Шапка</h2>
    <div class="row text-center">
        <div class="col-12 md:col p-3 bg-danger fg-white">1</div>
        <div class="col-12 md:col p-3 bg-warning">2</div>
        <div class="col-12 md:col p-3 fg-white bg-black">3</div>
        <div class="col-12 md:col p-3 bg-success fg-white">4</div>
        <div class="col-12 md:col p-3 bg-info">5</div>
    </div>
    <h2>Мейн</h2>
    <div class="row text-center">
        <div class="col-12 md:col-8 p-3 bg-danger fg-white">1</div>
        <div class="col-12 md:col-4 p-3 bg-warning">2</div>
    </div>
    <h2>Футер</h2>
    <div class="row text-center">
        <div class="col-12 sm:col-6 md:col-4 xl:col-3 p-3 bg-danger fg-white">1</div>
        <div class="col-12 sm:col-6 md:col-4 xl:col-3 p-3 bg-warning">2</div>
        <div class="col-12 xl:col-3 sm:d-none xl:d-block p-3 fg-white bg-black">3</div>
        <div class="col-12 sm:col-12 md:col-4 xl:col-3 p-3 bg-success fg-white">4</div>
    </div>
</div>
