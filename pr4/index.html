<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="feedback-form" action="" method="post">
        <a href="" class="form-close">Закрыть</a>

        <header class="form-header">
            <h1>Напишите нам</h1>
            <h2>Мы будем очень рады вашему письму!</h2>
        </header>
        <div class="form-grid">
            <label for="name">* Имя</label>
            <input type="text" name="username" placeholder="Напишите ваше имя">

            <label for="email">* Электронная почта</label>
            <input type="email" name="email" placeholder="Напишите ваш электронный адрес">

            <label for="message">Текст сообщения</label>
            <textarea name="message" placeholder="Введите текст сообщения"></textarea>
        </div>
        <footer class="form-footer">
            <button type="submit" class="submit-btn">Отправить</button>
            <p>Поля, отмеченные * обязательны для заполнения</p>
        </footer>
    </form>
</body>
</html>
